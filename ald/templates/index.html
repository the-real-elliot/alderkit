<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALD // ELLIOT — Security Operations Core</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0A0D12;
    --panel: #12161D;
    --panel-2: #171C24;
    --border: #232A35;
    --border-soft: #1A2029;
    --text: #C9D1D9;
    --text-dim: #6B7480;
    --text-faint: #454E5B;
    --accent: #FFB020;
    --accent-dim: #7A5A1E;
    --accent-glow: rgba(255, 176, 32, 0.15);
    --cyan: #4FD1D9;
    --red: #E5484D;
    --red-dim: #5A2426;
    --green: #3FB950;
    --radius: 3px;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    height: 100%;
    overflow: hidden;
  }

  body {
    display: grid;
    grid-template-columns: 280px 1fr;
    height: 100vh;
  }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-faint); }

  /* ---------------- SIDEBAR ---------------- */
  .sidebar {
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  .brand {
    padding: 18px 18px 14px;
    border-bottom: 1px solid var(--border);
  }

  .brand-mark {
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 1px;
    color: var(--accent);
  }

  .brand-sub {
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 2px;
    margin-top: 3px;
  }

  .target-box {
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
  }

  .target-label {
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 1.5px;
    margin-bottom: 7px;
  }

  .target-row {
    display: flex;
    gap: 6px;
  }

  .target-row input {
    flex: 1;
    min-width: 0;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--accent);
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 600;
    padding: 7px 9px;
    border-radius: var(--radius);
    outline: none;
  }

  .target-row input:focus {
    border-color: var(--accent-dim);
  }

  .target-row button {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-family: var(--mono);
    font-size: 11px;
    padding: 0 10px;
    border-radius: var(--radius);
    cursor: pointer;
  }

  .target-row button:hover {
    border-color: var(--accent-dim);
    color: var(--accent);
  }

  .filter-box {
    padding: 10px 18px;
  }

  .filter-box input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--mono);
    font-size: 12px;
    padding: 7px 9px;
    border-radius: var(--radius);
    outline: none;
  }

  .filter-box input:focus { border-color: var(--accent-dim); }
  .filter-box input::placeholder { color: var(--text-faint); }

  .nav {
    flex: 1;
    overflow-y: auto;
    padding: 4px 0 14px;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 8px 18px;
    font-size: 12.5px;
    cursor: pointer;
    color: var(--text-dim);
    border-left: 2px solid transparent;
    user-select: none;
  }

  .nav-item:hover { color: var(--text); background: var(--panel-2); }

  .nav-item.selected {
    color: var(--accent);
    background: var(--panel-2);
    border-left-color: var(--accent);
  }

  .nav-item.planned { color: var(--text-faint); }
  .nav-item.planned:hover { color: var(--text-dim); }

  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    flex-shrink: 0;
    background: var(--text-faint);
  }

  .dot.on { background: var(--green); box-shadow: 0 0 5px var(--green); }
  .dot.partial { background: var(--accent); box-shadow: 0 0 5px var(--accent); }

  .nav-num {
    margin-left: auto;
    font-size: 10px;
    color: var(--text-faint);
  }

  /* ---------------- MAIN ---------------- */
  .main {
    display: flex;
    flex-direction: column;
    min-height: 0;
    min-width: 0;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    height: 54px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .breadcrumb {
    font-size: 13px;
    color: var(--text-dim);
  }

  .breadcrumb b {
    color: var(--text);
    font-weight: 600;
  }

  .topbar-right {
    display: flex;
    align-items: center;
    gap: 16px;
    font-size: 11.5px;
    color: var(--text-dim);
  }

  .status-pill {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 9px;
    border: 1px solid var(--border);
    border-radius: 12px;
  }

  .content {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    min-height: 0;
  }

  .content-header {
    margin-bottom: 18px;
  }

  .content-title {
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: 0.3px;
  }

  .content-desc {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 4px;
  }

  .planned-banner {
    border: 1px dashed var(--border);
    border-radius: var(--radius);
    padding: 16px;
    color: var(--text-dim);
    font-size: 12.5px;
    max-width: 520px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 12px;
  }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 15px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .card-title {
    font-size: 13.5px;
    font-weight: 600;
    color: var(--text);
  }

  .tool-list {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .tool-chip {
    font-size: 10.5px;
    padding: 3px 7px;
    border-radius: 10px;
    border: 1px solid var(--border);
    color: var(--text-faint);
  }

  .tool-chip.found {
    color: var(--green);
    border-color: #1F3D26;
  }

  .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: auto;
    padding-top: 4px;
  }

  .card-status {
    font-size: 10.5px;
    color: var(--text-faint);
  }

  .card-status.ready { color: var(--green); }
  .card-status.missing { color: var(--red); }

  .run-btn {
    background: transparent;
    border: 1px solid var(--accent-dim);
    color: var(--accent);
    font-family: var(--mono);
    font-size: 11.5px;
    font-weight: 600;
    padding: 6px 13px;
    border-radius: var(--radius);
    cursor: pointer;
    letter-spacing: 0.4px;
  }

  .run-btn:hover:not(:disabled) {
    background: var(--accent-glow);
  }

  .run-btn:disabled {
    color: var(--text-faint);
    border-color: var(--border);
    cursor: not-allowed;
  }

  /* ---------------- CONSOLE DRAWER ---------------- */
  .console {
    flex-shrink: 0;
    border-top: 1px solid var(--border);
    background: #0D1015;
    display: flex;
    flex-direction: column;
    height: 34px;
    transition: height 0.18s ease;
    overflow: hidden;
  }

  .console.open { height: 260px; }

  .console-bar {
    height: 34px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    cursor: pointer;
    font-size: 11px;
    color: var(--text-dim);
  }

  .console-bar .lbl { display: flex; align-items: center; gap: 8px; }

  .console-body {
    flex: 1;
    overflow-y: auto;
    padding: 0 16px 14px;
    font-size: 12px;
    line-height: 1.55;
    white-space: pre-wrap;
    word-break: break-word;
    color: var(--text-dim);
  }

  .console-body .evid {
    color: var(--cyan);
  }

  .console-body .err {
    color: var(--red);
  }

  .blink {
    animation: blink 1.1s step-start infinite;
  }

  @keyframes blink {
    50% { opacity: 0; }
  }

  /* ---------------- MODAL ---------------- */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(5, 6, 8, 0.7);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 50;
  }

  .modal-backdrop.show { display: flex; }

  .modal {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    width: 420px;
    padding: 20px;
  }

  .modal-title {
    font-size: 13px;
    color: var(--accent);
    font-weight: 700;
    letter-spacing: 0.5px;
    margin-bottom: 14px;
  }

  .modal-row {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--text-dim);
    padding: 5px 0;
    border-bottom: 1px solid var(--border-soft);
  }

  .modal-row b { color: var(--text); font-weight: 500; }

  .modal-check {
    display: flex;
    align-items: flex-start;
    gap: 9px;
    margin: 16px 0 18px;
    font-size: 12px;
    color: var(--text);
    line-height: 1.5;
  }

  .modal-check input { margin-top: 3px; }

  .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
  }

  .btn-ghost {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-family: var(--mono);
    font-size: 12px;
    padding: 7px 14px;
    border-radius: var(--radius);
    cursor: pointer;
  }

  .btn-ghost:hover { color: var(--text); border-color: var(--text-faint); }

  .btn-confirm {
    background: var(--accent);
    border: 1px solid var(--accent);
    color: #1A1200;
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 700;
    padding: 7px 14px;
    border-radius: var(--radius);
    cursor: pointer;
  }

  .btn-confirm:disabled {
    background: var(--border);
    border-color: var(--border);
    color: var(--text-faint);
    cursor: not-allowed;
  }
</style>
</head>
<body>

<div class="sidebar">
  <div class="brand">
    <div class="brand-mark">ALD // ELLIOT</div>
    <div class="brand-sub">SECURITY OPERATIONS CORE</div>
  </div>

  <div class="target-box">
    <div class="target-label">TARGET</div>
    <div class="target-row">
      <input id="targetInput" placeholder="127.0.0.1" spellcheck="false">
      <button id="targetSet">SET</button>
    </div>
  </div>

  <div class="filter-box">
    <input id="filterInput" placeholder="filter modules...">
  </div>

  <div class="nav" id="nav"></div>
</div>

<div class="main">
  <div class="topbar">
    <div class="breadcrumb" id="breadcrumb">Select a category</div>
    <div class="topbar-right">
      <span id="clock"></span>
      <span class="status-pill"><span class="dot on"></span>BACKEND LIVE</span>
    </div>
  </div>

  <div class="content" id="content"></div>

  <div class="console" id="console">
    <div class="console-bar" id="consoleBar">
      <span class="lbl"><span class="dot" id="consoleDot"></span> OUTPUT</span>
      <span id="consoleMeta">idle</span>
    </div>
    <div class="console-body" id="consoleBody">No module has been run yet.</div>
  </div>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <div class="modal-title">CONFIRM EXECUTION</div>
    <div class="modal-row"><span>Target</span><b id="modalTarget"></b></div>
    <div class="modal-row"><span>Category</span><b id="modalCategory"></b></div>
    <div class="modal-row"><span>Module</span><b id="modalModule"></b></div>
    <label class="modal-check">
      <input type="checkbox" id="modalCheck">
      I have explicit, documented authorization to assess this target.
    </label>
    <div class="modal-actions">
      <button class="btn-ghost" id="modalCancel">Cancel</button>
      <button class="btn-confirm" id="modalConfirm" disabled>Confirm &amp; Run</button>
    </div>
  </div>
</div>

<script>
let MENU = [];
let SELECTED = null;
let PENDING = null;

const $ = (id) => document.getElementById(id);

function fmtClock() {
  const d = new Date();
  $('clock').textContent = d.toLocaleString('en-US', {
    hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit'
  }) + '  ' + d.toLocaleDateString('en-US', { year: '2-digit', month: '2-digit', day: '2-digit' });
}
setInterval(fmtClock, 1000);
fmtClock();

async function loadTarget() {
  const r = await fetch('/api/target');
  const j = await r.json();
  $('targetInput').value = j.target || '';
}

async function setTarget() {
  const target = $('targetInput').value.trim();
  if (!target) return;
  await fetch('/api/target', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ target })
  });
}

function categoryDotClass(cat) {
  if (!cat.active) return '';
  const ready = cat.modules.filter(m => m.ready).length;
  if (ready === 0) return '';
  if (ready === cat.modules.length) return 'on';
  return 'partial';
}

function renderNav(filter) {
  const nav = $('nav');
  nav.innerHTML = '';
  const f = (filter || '').toLowerCase();

  MENU.forEach((cat, i) => {
    if (f && !cat.name.toLowerCase().includes(f)) return;

    const div = document.createElement('div');
    div.className = 'nav-item' + (cat.active ? '' : ' planned') + (SELECTED === i ? ' selected' : '');
    div.innerHTML = `
      <span class="dot ${categoryDotClass(cat)}"></span>
      <span>${cat.name}</span>
      ${cat.active ? `<span class="nav-num">${cat.modules.length}</span>` : `<span class="nav-num">planned</span>`}
    `;
    div.onclick = () => { SELECTED = i; renderNav($('filterInput').value); renderContent(); };
    nav.appendChild(div);
  });
}

function renderContent() {
  const content = $('content');
  if (SELECTED === null) {
    content.innerHTML = '<div class="content-desc">Select a category from the left to view its modules.</div>';
    $('breadcrumb').textContent = 'Select a category';
    return;
  }

  const cat = MENU[SELECTED];
  $('breadcrumb').innerHTML = `<b>${cat.name}</b>`;

  if (!cat.active) {
    content.innerHTML = `
      <div class="content-header">
        <div class="content-title">${cat.name}</div>
        <div class="content-desc">Not wired into the engine yet.</div>
      </div>
      <div class="planned-banner">This category exists in the menu but has no registry entry or dispatch logic in ald.core yet. Add it to registry.REGISTRY and engine.dispatch() to activate it here — the dashboard will pick it up automatically.</div>
    `;
    return;
  }

  const cards = cat.modules.map(m => {
    const chips = m.candidates.map(c => {
      const found = m.installed.includes(c);
      return `<span class="tool-chip ${found ? 'found' : ''}">${c}</span>`;
    }).join('');

    const canRun = m.ready && m.dispatchable;
    let statusText, statusClass;
    if (!m.ready) { statusText = 'no candidate tool installed'; statusClass = 'missing'; }
    else if (!m.dispatchable) { statusText = 'tool ready — not wired to dispatch()'; statusClass = ''; }
    else { statusText = 'ready'; statusClass = 'ready'; }

    return `
      <div class="card">
        <div class="card-title">${m.name}</div>
        <div class="tool-list">${chips || '<span class="tool-chip">no candidates listed</span>'}</div>
        <div class="card-footer">
          <span class="card-status ${statusClass}">${statusText}</span>
          <button class="run-btn" ${canRun ? '' : 'disabled'} data-cat="${cat.key}" data-mod="${m.name}">RUN</button>
        </div>
      </div>
    `;
  }).join('');

  content.innerHTML = `
    <div class="content-header">
      <div class="content-title">${cat.name}</div>
      <div class="content-desc">${cat.modules.length} module(s) · target-scoped</div>
    </div>
    <div class="grid">${cards}</div>
  `;

  content.querySelectorAll('.run-btn').forEach(btn => {
    btn.onclick = () => openModal(btn.dataset.cat, btn.dataset.mod);
  });
}

async function openModal(category, module) {
  const target = $('targetInput').value.trim();
  if (!target) { alert('Set a target first.'); return; }

  PENDING = { category, module };
  $('modalTarget').textContent = target;
  $('modalCategory').textContent = category;
  $('modalModule').textContent = module;
  $('modalCheck').checked = false;
  $('modalConfirm').disabled = true;
  $('modalBackdrop').classList.add('show');
}

$('modalCheck').addEventListener('change', (e) => {
  $('modalConfirm').disabled = !e.target.checked;
});

$('modalCancel').onclick = () => $('modalBackdrop').classList.remove('show');

$('modalConfirm').onclick = async () => {
  $('modalBackdrop').classList.remove('show');
  await runModule(PENDING.category, PENDING.module);
};

let runTimer = null;

async function runModule(category, module) {
  const consoleEl = $('console');
  consoleEl.classList.add('open');
  $('consoleDot').className = 'dot partial blink';
  $('consoleBody').textContent = `Running ${category} → ${module} ...`;

  let elapsed = 0;
  runTimer = setInterval(() => {
    elapsed += 1;
    $('consoleMeta').textContent = `running · ${elapsed}s`;
  }, 1000);

  try {
    const r = await fetch('/api/run', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ category, module, authorized: true })
    });
    const j = await r.json();

    clearInterval(runTimer);
    $('consoleDot').className = r.ok ? 'dot on' : 'dot';

    if (!r.ok) {
      $('consoleMeta').textContent = 'error';
      $('consoleBody').innerHTML = `<span class="err">[-] ${j.error || 'run failed'}</span>`;
      return;
    }

    $('consoleMeta').textContent = `done · ${j.elapsed}s`;
    const evid = j.evidence_dir ? `<span class="evid">[evidence] ${j.evidence_dir}</span>\n\n` : '';
    $('consoleBody').innerHTML = evid + escapeHtml(j.output || '');
  } catch (e) {
    clearInterval(runTimer);
    $('consoleDot').className = 'dot';
    $('consoleMeta').textContent = 'error';
    $('consoleBody').innerHTML = `<span class="err">[-] ${e}</span>`;
  }

  renderContent(); // refresh install/ready state after a run
}

function escapeHtml(s) {
  return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
}

$('consoleBar').onclick = () => $('console').classList.toggle('open');
$('targetSet').onclick = setTarget;
$('targetInput').addEventListener('keydown', e => { if (e.key === 'Enter') setTarget(); });
$('filterInput').addEventListener('input', e => renderNav(e.target.value));

async function boot() {
  await loadTarget();
  const r = await fetch('/api/menu');
  MENU = await r.json();
  const firstActive = MENU.findIndex(c => c.active);
  SELECTED = firstActive >= 0 ? firstActive : null;
  renderNav('');
  renderContent();
}
boot();
</script>
</body>
</html>
